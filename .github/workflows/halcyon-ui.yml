name: Halcyon UI (auto sync upstream + build)

# 自动跟踪上游 zzyoxml/md3Music：发现上游新提交 → 检出上游最新代码 →
# 应用 Halcyon UI 补丁（悬浮毛玻璃底栏 + 毛玻璃迷你条）→ 自动编译 APK →
# 自动发 Release。补丁打不上（上游改了相关文件）时自动开 issue 提醒。
#
# 使用方法（一次性）：
#   1. 在 GitHub 上 fork zzyoxml/md3Music
#   2. 把本仓库树里的 .github/workflows/halcyon-ui.yml 与 halcyon-ui/
#      目录（原样）推到 fork 的默认分支
#   3. fork 页面 Actions 标签页启用 workflow —— 之后全自动
#
# 产物：Releases 里的 md3music-halcyon-<日期>-arm64-v8a.apk

on:
  schedule:
    - cron: "23 */6 * * *" # 每 6 小时（分钟值错开整点高峰）
  workflow_dispatch: # 手动触发入口（inputs.force=true 可越过 release 去重强制重建）
    inputs:
      force:
        description: 'Force build even if release exists'
        type: boolean
        default: false

permissions:
  contents: write # 创建 Release
  issues: write # 补丁冲突时自动开 issue

concurrency:
  group: halcyon-ui
  cancel-in-progress: true

jobs:
  sync-build:
    name: Sync upstream & build Halcyon UI APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 1. 检出 fork（主要为了拿 halcyon-ui/ 补丁目录；代码随后切到上游树）
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. 查上游默认分支最新提交（分支名动态获取——上游曾把默认分支
      #    从 main 改为 rust-local-force，写死会 404）
      - name: Detect upstream latest commit
        id: upstream
        run: |
          base=$(curl -sf https://api.github.com/repos/zzyoxml/md3Music | jq -r .default_branch)
          latest=$(curl -sf "https://api.github.com/repos/zzyoxml/md3Music/commits/$base" | jq -r .sha)
          short=${latest:0:10}
          date=$(curl -sf "https://api.github.com/repos/zzyoxml/md3Music/commits/$base" | jq -r .commit.committer.date | cut -c1-10)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "sha=$latest" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "上游默认分支: $base | 最新提交: $short ($date)"

      # 3. 去重：同一上游提交只构建一次（按 release 是否存在判断）
      - name: Skip if already built
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 手动 dispatch 可带 force=true 强制重建（补丁更新后上游 sha 未变时用）
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "force=true，强制构建"
          elif gh release view "halcyon-ui-${{ steps.upstream.outputs.short }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "已构建过该提交，跳过"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # 4. 备份补丁（切到上游树后 fork 独有文件会消失）
      - name: Stage patch file
        run: cp halcyon-ui/halcyon-ui-final.patch /tmp/halcyon-final.patch

      # 5. 检出上游工作树（默认分支）
      - name: Checkout upstream tree
        if: steps.check.outputs.build == 'true'
        run: |
          git remote add upstream https://github.com/zzyoxml/md3Music.git
          git fetch upstream "${{ steps.upstream.outputs.base }}" --depth=1
          git checkout --detach FETCH_HEAD
          git status | head -3

      # 6. 应用 Halcyon UI 成品补丁（单文件包含全部阶段；3way 容忍上游已改过这些文件的场景）
      - name: Apply Halcyon UI patch
        if: steps.check.outputs.build == 'true'
        run: |
          if git apply --3way /tmp/halcyon-final.patch; then
            echo "补丁应用成功"
          else
            echo "补丁应用失败：上游相关文件已改动，需要人工更新补丁"
            gh issue create \
              -R "$GITHUB_REPOSITORY" \
              --title "Halcyon UI 补丁冲突（上游 ${{ steps.upstream.outputs.short }}）" \
              --body "上游 md3Music 最新提交已改动补丁涉及的文件，git apply --3way 失败。请重新生成补丁（更新 halcyon-ui/halcyon-ui-final.patch）。" || true
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # 6.5 中和 lint NewApi：上游 styles.xml 的 windowLayoutInDisplayCutoutMode
      # 需要 API 27 而 minSdk 24，新 lint 版本把 NewApi 当 error 挂掉 release 构建
      # （v1 时 lint 未报，CI 工具链版本漂移后开始报）。注入 tools:targetApi 声明
      # 目标 API，运行时行为完全不变（shortEdges 沉浸逻辑保留，vivo 岛适配不受影响）。
      - name: Neutralize lint NewApi (cutoutMode API 27 vs minSdk 24)
        if: steps.check.outputs.build == 'true'
        run: |
          for f in android/app/src/main/res/values/styles.xml \
                   android/app/src/main/res/values-night/styles.xml; do
            if [ -f "$f" ]; then
              sed -i 's|<resources>|<resources xmlns:tools="http://schemas.android.com/tools">|' "$f"
              sed -i 's|<item name="android:windowLayoutInDisplayCutoutMode">|<item name="android:windowLayoutInDisplayCutoutMode" tools:targetApi="27">|g' "$f"
              echo "neutralized: $f"
            fi
          done

      # 7. 构建环境（与上游 main.yml 同链路：JDK17 + android-36 + Flutter stable）
      - name: Set up JDK 17
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.check.outputs.build == 'true'
        uses: android-actions/setup-android@v3
        with:
          # 与上游 main.yml 同口径：packages 参数必带（无参会走默认全量安装，
          # 在新 runner 上触发 "Wrong version in preinstalled sdkmanager"
          # + license 交互挂死——首跑已实证）；其余包显式安装。
          packages: platform-tools

      - name: Install Android SDK packages
        if: steps.check.outputs.build == 'true'
        run: |
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.0.0" > /dev/null

      - name: Cache Gradle
        if: steps.check.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-halcyon-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Set up Flutter
        if: steps.check.outputs.build == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 8. 构建（抄上游 main.yml 的 standard flavor 口径；Impeller 关闭与其一致）
      - name: Flutter pub get
        if: steps.check.outputs.build == 'true'
        run: flutter pub get

      - name: Build APK (arm64)
        if: steps.check.outputs.build == 'true'
        run: |
          # 注意：不再传 --android-project-arg=md3EnableImpeller=false（上游 main.yml
          # 的 Skia 口径）。液态玻璃镜片（dart:ui ImageFilter.shader）是 Impeller
          # 专有，Skia 下抛 UnsupportedError 且 isShaderFilterSupported=false 直接
          # 退化成色块 pill；且 Flutter 3.47 已把 Impeller opt-out 标记为弃用
          # （引擎日志实测警告）。上游 gradle 默认 enableImpeller=true，不传即启用。
          flutter build apk --release --flavor standard --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --dart-define=APP_VERSION=halcyon-ui-${{ steps.upstream.outputs.short }}
          ls build/app/outputs/flutter-apk/

      # 9. 发布（同上游提交只发一次；tag 已存在时覆盖同名资产——force 重建场景）
      - name: Create release
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="halcyon-ui-${{ steps.upstream.outputs.short }}"
          apk=$(ls build/app/outputs/flutter-apk/*arm64*v8a*release*.apk | head -1)
          apk_x64=$(ls build/app/outputs/flutter-apk/*x86_64*release*.apk | head -1 || true)
          asset="md3music-halcyon-arm64-v8a.apk"
          asset_x64="md3music-halcyon-x86_64.apk"
          notes="自动同步上游 md3Music ${{ steps.upstream.outputs.base }}@${{ steps.upstream.outputs.short }} 并应用 Halcyon 风格 UI 成品补丁（悬浮毛玻璃底栏 + 悬浮胶囊迷你播放条 + 全局玻璃卡片 + 文字底模糊衬 + 底栏滚动隐藏 + 横屏玻璃 rail，保留进度环绕描边效果）。"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag 已存在，覆盖资产 $asset"
            # 先删同名资产再上传：gh upload --clobber 在重复资产名上会偶发
            # HTTP 422 Validation Failed（run 41275151987 实锤），删了重传绕开
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq \
              ".assets[] | select(.name==\"$asset\") | .id" \
              | while read -r aid; do
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid" || true
                done
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber "$apk#$asset"
            if [ -n "${apk_x64:-}" ]; then
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq \
                ".assets[] | select(.name==\"$asset_x64\") | .id" \
                | while read -r aid; do
                    gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid" || true
                  done
              gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber "$apk_x64#$asset_x64"
            fi
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" \
              --title "Halcyon UI @ 上游 ${{ steps.upstream.outputs.date }} (${{ steps.upstream.outputs.short }})" \
              --notes "$notes" \
              "$apk#$asset" \
              ${apk_x64:+"$apk_x64#$asset_x64"}
          fi
